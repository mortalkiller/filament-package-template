name: Reusable browser tests

on:
  workflow_call:
    inputs:
      filament-matrix-json:
        required: true
        type: string
      php-version:
        required: false
        default: '8.4'
        type: string
      prepare-command:
        required: false
        default: composer browser:prepare
        type: string
      test-command:
        required: false
        default: npm run test:browser
        type: string
      node-version:
        required: false
        default: '22.20.0'
        type: string

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.filament-matrix-json) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ inputs.php-version }}
          extensions: intl, mbstring, pdo_sqlite, dom, fileinfo, curl, zip
          coverage: none
          tools: composer:v2

      - name: Resolve Filament boundary
        env:
          FILAMENT_CONSTRAINT: ${{ matrix.filament }}
        run: |
          composer require "filament/filament:${FILAMENT_CONSTRAINT}" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Prepare browser workbench
        env:
          PREPARE_COMMAND: ${{ inputs.prepare-command }}
        run: bash -lc "$PREPARE_COMMAND"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -lc "$TEST_COMMAND"

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-report-filament-${{ matrix.filament }}
          path: |
            playwright-report/
            test-results/
            workbench/storage/logs/
          if-no-files-found: ignore
          retention-days: 7
