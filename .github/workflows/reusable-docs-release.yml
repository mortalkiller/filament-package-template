name: Reusable release documentation

on:
  workflow_call:
    inputs:
      standard-ref:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
      release-tag:
        type: string
        default: ''
      dry-run:
        type: boolean
        default: true
      docs-directory:
        type: string
        default: docs-site

permissions:
  contents: read
  actions: read

concurrency:
  group: docs-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build release documentation
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.input.outputs.tag }}
    steps:
      - name: Validate publication request
        id: input
        env:
          REQUESTED_TAG: ${{ inputs.release-tag }}
          STANDARD_REF: ${{ inputs.standard-ref }}
          DRY_RUN: ${{ inputs.dry-run }}
          DEPLOY_ENABLED: ${{ vars.DOCS_DEPLOY_ENABLED }}
        run: |
          python3 - <<'PY'
          import json, os, re
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          name = os.environ['GITHUB_EVENT_NAME']
          if name == 'release':
              release = event.get('release', {})
              assert event.get('action') == 'published' and not release.get('draft', True) and not release.get('prerelease', True), 'Only published stable releases are allowed.'
              tag = release.get('tag_name', '')
          else:
              assert name == 'workflow_dispatch', 'Unsupported publication event.'
              tag = os.environ['REQUESTED_TAG']
              if os.environ['DRY_RUN'] != 'true':
                  assert re.fullmatch(r'refs/heads/(0|[1-9][0-9]*)\\.x', os.environ['GITHUB_REF']), 'Manual publication must run from a major branch.'
          assert re.fullmatch(r'v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)', tag), 'A stable vX.Y.Z tag is required.'
          assert re.fullmatch(r'[a-f0-9]{40}', os.environ['STANDARD_REF']), 'The tooling reference must be a full commit SHA.'
          if os.environ['DRY_RUN'] != 'true':
              assert os.environ['DEPLOY_ENABLED'] == 'true', 'Documentation deployment is disabled.'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          PY
      - name: Checkout the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ steps.input.outputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout pinned publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mortalkiller/filament-package-template
          ref: ${{ inputs.standard-ref }}
          path: .mortal-package-standard
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Verify release, major ancestry and exact-commit CI
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.input.outputs.tag }}
          DOCS_DIRECTORY: ${{ inputs.docs-directory }}
        run: node .mortal-package-standard/tools/docs-release.mjs prepare
      - name: Install documentation dependencies
        if: steps.plan.outputs.publish == 'true'
        working-directory: ${{ inputs.docs-directory }}
        run: |
          if test -f package-lock.json; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Build major and canonical Latest artifacts
        if: steps.plan.outputs.publish == 'true'
        env:
          DOCS_DIRECTORY: ${{ inputs.docs-directory }}
          DOCS_RELEASE_VERSION: ${{ steps.input.outputs.tag }}
          DOCS_MAJOR_BRANCH: ${{ steps.plan.outputs.major }}
          PACKAGE_SLUG: ${{ steps.plan.outputs.slug }}
        run: |
          export DOCS_BASE_PATH="/$PACKAGE_SLUG/$DOCS_MAJOR_BRANCH"
          node .mortal-package-standard/tools/docs-release.mjs assets
          (cd "$DOCS_DIRECTORY" && npm run build)
          mv "$DOCS_DIRECTORY/dist" .docs-release/major
          export DOCS_BASE_PATH="/$PACKAGE_SLUG"
          node .mortal-package-standard/tools/docs-release.mjs assets
          (cd "$DOCS_DIRECTORY" && npm run build)
          mv "$DOCS_DIRECTORY/dist" .docs-release/latest
      - name: Upload verified artifacts
        if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.artifact-name }}
          path: .docs-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
