name: Package tests

on:
  pull_request:
  push:
    branches: ['*.x']

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/reusable-tests.yml
    with:
      matrix-json: >-
        {"include":[{"php":"8.3","testbench":"^11.0","filament":"5.8.1","dependencies":"lowest","expected_filament":"5.8.1"},{"php":"8.5","testbench":"^11.0","filament":"^5.8.1","dependencies":"latest"}]}

  skills:
    name: Laravel Boost skill discovery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify developing-filament-packages discovery
        shell: bash
        run: vendor/bin/testbench boost:list-skills --no-ansi | grep -F 'developing-filament-packages'

