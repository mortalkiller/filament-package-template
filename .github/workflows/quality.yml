name: Code quality

on:
  pull_request:
  push:
    branches:
      - main
      - '1.x'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/reusable-quality.yml
    with:
      php-version: '8.4'
      static-analysis: true
